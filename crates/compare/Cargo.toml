[package]
name = "compare"
version = "0.0.0"
description = "Differential tests and benchmarks of rust-zstd-decoder against C libzstd"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

[dependencies]
fastrand = { version = "2.5.0", default-features = false }
rust-zstd-decoder = { path = "../.." }
# C libzstd 1.5.7, static, no legacy support (PLAN.md D1).
zstd-sys = { version = "2.1.2", default-features = false, features = ["experimental"] }
